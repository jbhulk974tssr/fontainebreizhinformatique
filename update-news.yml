name: Mise a jour auto des actualites

on:
  schedule:
    # Exécution à 8h00, 12h00 et 18h00 (Heure de Paris)
    # Les serveurs GitHub sont en UTC, on décale donc de 2h
    - cron: "0 6,10,16 * * *"
  
  # Cette ligne te permet aussi de forcer la mise à jour manuellement via un bouton sur GitHub
  workflow_dispatch: 

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Donne le droit au bot de sauvegarder le nouveau index.html

    steps:
      - name: Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: Préparation de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des paquets nécessaires
        # On s'assure d'installer feedparser et les librairies classiques pour lire les flux RSS
        run: pip install feedparser requests beautifulsoup4

      - name: Exécution du script Python
        # C'est ici que ton script va lire les RSS et modifier le fichier index.html
        run: python update_news.py

      - name: Commit et Push (Sauvegarde en ligne)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          # Le script vérifie s'il y a de nouvelles actus. Si oui, il sauvegarde, sinon il ne fait rien.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualisation automatique des actus IT" && git push)
