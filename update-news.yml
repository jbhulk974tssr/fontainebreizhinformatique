name: Actualiser les actualités IT

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC (~08:00 en France)
  workflow_dispatch:        # ajoute un bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Régénérer la section actualités
        run: python3 update_news.py

      - name: Commit et push si le contenu a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualisation automatique des actus IT"
          git push
